<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shark Tank India CRUD</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
margin:0;
}

h1{
text-align:center;
background:#111;
color:white;
padding:15px;
}

.container{
display:flex;
gap:20px;
padding:20px;
}

.sidebar{
width:320px;
background:white;
padding:20px;
border-radius:10px;
}

input,select{
width:100%;
padding:8px;
margin:5px 0;
}

button{
width:100%;
padding:10px;
margin:5px 0;
background:#33c3f0;
border:none;
color:white;
cursor:pointer;
}

.cards{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.card img{
width:100px;
}

</style>
</head>

<body>

<h1>Shark Tank India</h1>

<div class="container">

<div class="sidebar">

<h3>Add Pitch</h3>

<input id="pitch-title" placeholder="Title">
<input id="pitch-image" placeholder="Image URL">
<input id="pitch-category" placeholder="Category">
<input id="pitch-founder" placeholder="Founder">
<input id="pitch-price" type="number" placeholder="Price">

<button id="add-pitch">Add Pitch</button>

<hr>

<h3>Update Pitch</h3>

<input id="update-pitch-id" placeholder="ID">
<input id="update-pitch-title" placeholder="Title">
<input id="update-pitch-image" placeholder="Image">
<input id="update-pitch-category" placeholder="Category">
<input id="update-pitch-founder" placeholder="Founder">
<input id="update-pitch-price" placeholder="Price">

<button id="update-pitch">Update Pitch</button>

<hr>

<h3>Update Price</h3>

<input id="update-price-pitch-id" placeholder="ID">
<input id="update-price-pitch-price" placeholder="Price">

<button id="update-price-pitch">Update Price</button>

<hr>

<h3>Sort</h3>

<button id="sort-low">Sort Low to High</button>
<button id="sort-high">Sort High to Low</button>

<hr>

<h3>Filter</h3>

<button id="filter-Food">Food</button>
<button id="filter-Electronics">Electronics</button>
<button id="filter-Personal">Personal Care</button>

<hr>

<h3>Search</h3>

<select id="search-by-select">
<option value="">Search By</option>
<option value="title">Title</option>
<option value="founder">Founder</option>
</select>

<input id="search-by-input" placeholder="Enter search text">

<button id="search-btn">Search</button>

</div>

<div class="cards" id="data-list-wrapper"></div>

</div>

<script>

const API="http://localhost:3000/pitches"

let main=document.getElementById("data-list-wrapper")

// LOAD DATA
window.onload=()=>{
fetchData()
}

// FETCH
function fetchData(url=API){

fetch(url)
.then(res=>res.json())
.then(data=>display(data))

}

// DISPLAY
function display(data){

main.innerHTML=""

data.forEach(p=>{

let card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img src="${p.image}">
<h3>${p.title}</h3>
<p>Founder: ${p.founder}</p>
<p>Category: ${p.category}</p>
<p>Price: ₹${p.price}</p>

<button onclick="deletePitch(${p.id})">Delete</button>

`

main.append(card)

})

}

// CREATE
document.getElementById("add-pitch").onclick=()=>{

let newPitch={

title:document.getElementById("pitch-title").value,
image:document.getElementById("pitch-image").value,
category:document.getElementById("pitch-category").value,
founder:document.getElementById("pitch-founder").value,
price:Number(document.getElementById("pitch-price").value)

}

fetch(API,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(newPitch)
})
.then(()=>fetchData())

}

// DELETE
function deletePitch(id){

fetch(${API}/${id},{
method:"DELETE"
})
.then(()=>fetchData())

}

// UPDATE FULL
document.getElementById("update-pitch").onclick=()=>{

let id=document.getElementById("update-pitch-id").value

let updated={

title:document.getElementById("update-pitch-title").value,
image:document.getElementById("update-pitch-image").value,
category:document.getElementById("update-pitch-category").value,
founder:document.getElementById("update-pitch-founder").value,
price:Number(document.getElementById("update-pitch-price").value)

}

fetch(${API}/${id},{

method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(updated)

}).then(()=>fetchData())

}

// UPDATE PRICE
document.getElementById("update-price-pitch").onclick=()=>{

let id=document.getElementById("update-price-pitch-id").value

fetch(${API}/${id},{

method:"PATCH",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({

price:Number(document.getElementById("update-price-pitch-price").value)

})

}).then(()=>fetchData())

}

// SORT
document.getElementById("sort-low").onclick=()=>{

fetchData(${API}?_sort=price&_order=asc)

}

document.getElementById("sort-high").onclick=()=>{

fetchData(${API}?_sort=price&_order=desc)

}

// FILTER
document.getElementById("filter-Food").onclick=()=>{

fetchData(${API}?category=Food)

}

document.getElementById("filter-Electronics").onclick=()=>{

fetchData(${API}?category=Electronics)

}

document.getElementById("filter-Personal").onclick=()=>{

fetchData(${API}?category=Personal-Care)

}

// SEARCH
document.getElementById("search-btn").onclick=()=>{

let field=document.getElementById("search-by-select").value
let value=document.getElementById("search-by-input").value

fetchData(${API}?${field}_like=${value})

}

</script>

</body>
</html>
